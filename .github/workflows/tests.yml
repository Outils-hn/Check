# Verification automatique a chaque envoi : tests, controle TypeScript et construction.
# Une croix rouge dans GitHub = quelque chose est casse, a ne pas fusionner.
name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # bun.lock pointe vers le cache prive de Lovable : installation depuis le registre public
      - name: Installer
        run: |
          set -o pipefail
          npm pkg set overrides.@types/estree=1.0.8
          npm install --no-package-lock --no-audit --no-fund --legacy-peer-deps 2>&1 | tee install.log || { grep -iE "ERR|error" install.log | head -n 15 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Tests
        run: |
          set -o pipefail
          npx vitest run 2>&1 | tee step.log || { grep -E "FAIL|Error|expected|×" step.log | head -n 20 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      # Deux erreurs heritees du modele Lovable (versions des paquets du registre public) sont
      # signalees sans bloquer ; toute autre erreur TypeScript fait echouer la verification.
      - name: Controle TypeScript
        run: |
          npx tsc --noEmit > step.log 2>&1 || true
          grep -E "error TS" step.log | grep -vE "^src/routes/__root\.tsx\([0-9]+,3\): error TS2322|^src/lib/api/example\.functions\.ts" > errs.log || true
          grep -E "error TS" step.log | grep -E "^src/routes/__root\.tsx\([0-9]+,3\): error TS2322|^src/lib/api/example\.functions\.ts" | while IFS= read -r l; do echo "::warning::$l"; done
          if [ -s errs.log ]; then head -n 25 errs.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; fi
      # La construction de production reste faite par Lovable (sa configuration ne tourne pas hors de Lovable).
