# Audit : parcours avec base simulee + controles en lecture seule de la vraie base. Resultats sur « captures/<branche> ».
name: Audit
on:
  push:
    branches: ["audit/**"]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm pkg set overrides.@types/estree=1.0.8
          npm install --no-package-lock --no-audit --no-fund --legacy-peer-deps
      - run: npm install --no-save --no-package-lock --legacy-peer-deps playwright@1.48.2 @axe-core/playwright@4.10.1 && npx playwright install --with-deps chromium
      - name: Parcours
        run: |
          mkdir -p out
          (npx vite dev --port 8080 --host 127.0.0.1 > dev.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/ >/dev/null && break; sleep 2; done
          node e2e/audit.mjs out || true
          tail -30 dev.log > out/dev-log.txt
      - name: Publier
        run: |
          cd out
          git init -q -b "captures/${GITHUB_REF_NAME}"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Audit ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/captures/${GITHUB_REF_NAME}"
